[package]
name = "app"
version = "0.3.1"
description = "Fast Text Search Windows Application"
authors = ["you"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
ignore = "0.4"
memmap2 = "0.9"
memchr = "2.7"
aho-corasick = "1.1"
regex = "1.10"
encoding_rs = "0.8"
chardetng = "0.1"
calamine = "0.26"
rfd = "0.15"
walkdir = "2.5"


